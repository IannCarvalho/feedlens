name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt
          fi
          pip install ruff

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        env:
          SECRET_KEY: test-secret
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          if [ -d tests ]; then
            pytest tests
          else
            echo "No tests directory yet; skipping."
          fi

  postgres:
    # Roda as migrations e a suíte contra um Postgres de verdade: o SQLite dos
    # testes acima não pega estouro de VARCHAR, FK, índices nem timestamptz.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: feedlens
          POSTGRES_PASSWORD: feedlens
          POSTGRES_DB: feedlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U feedlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENAI_API_KEY: test-key
      SECRET_KEY: test-secret
      DATABASE_URL: postgresql://feedlens:feedlens@localhost:5432/feedlens
      FLASK_APP: wsgi:app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install -r requirements.txt
          fi

      - name: Migrations (upgrade, check, downgrade, upgrade)
        run: |
          flask db upgrade
          flask db check
          flask db downgrade base
          flask db upgrade
          flask db downgrade base

      - name: Run tests on Postgres
        run: pytest tests

  frontend:
    # Compila o front Vue (typecheck + lint + build). Garante que o painel
    # continua buildável a cada PR; o artefato é gerado no deploy, não comitado.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # O painel exige Node >= 24.15 (engines em frontend/package.json);
          # "24" resolve para a última 24.x publicada.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    # Builda a imagem de produção e confere que ela serve o painel: o painel
    # não vem deste repositório, o Dockerfile o baixa do release do
    # feedlens-panel e recusa o build se o checksum não bater.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t feedlens:ci .

      - name: Smoke test (painel e assets servidos pela imagem)
        run: |
          docker run -d --name feedlens -p 5000:5000 \
            -e FLASK_ENV=production \
            -e SECRET_KEY=ci-smoke-secret-key-0123456789abcdef \
            -e DATABASE_URL=sqlite:////tmp/feedlens.db \
            feedlens:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5000/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:5000/health
          curl -fsS http://localhost:5000/ > index.html
          grep -q '<div id="app">' index.html
          asset=$(grep -o '/static/spa/assets/[^"]*\.js' index.html | head -n 1)
          test -n "$asset"
          curl -fsS -o /dev/null "http://localhost:5000$asset"

      - name: Logs do container
        if: failure()
        run: docker logs feedlens

  feedback-form:
    # Formulário público (Angular 22). Projeto separado do painel: tem o próprio
    # package.json, build e deploy, e o Flask não o serve.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feedback-form
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Angular 22 exige Node >= 24.15 (ou 22.22.3); "24" resolve para a última 24.x.
          node-version: "24"
          cache: npm
          cache-dependency-path: feedback-form/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build (inclui o orçamento de bundle)
        run: npm run build
