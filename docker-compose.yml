services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: feedlens
      POSTGRES_PASSWORD: feedlens
      POSTGRES_DB: feedlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedlens"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: production
      # Obrigatoria: com uma chave conhecida o cookie de sessao e forjavel.
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY com 32+ caracteres aleatorios (veja o README)}
      # O compose serve HTTP em localhost; em producao (HTTPS) deixe true.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DATABASE_URL: postgresql://feedlens:feedlens@db:5432/feedlens
      # LLM (BYOK): todas opcionais; sem nenhuma, so BYOK por requisicao
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Acesso: senha do painel, token de leitura da API, chave de ingestao e
      # chave do cofre de provedores. Vazias = recurso desligado/aberto (dev).
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      API_READ_TOKEN: ${API_READ_TOKEN:-}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
      FEEDLENS_ENCRYPTION_KEY: ${FEEDLENS_ENCRYPTION_KEY:-}
      LLM_MODELS: ${LLM_MODELS:-}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_RECIPIENTS: ${EMAIL_RECIPIENTS:-}
      # Container de processo unico (1 worker gunicorn): pode agendar o resumo.
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_TIMEZONE: ${SCHEDULER_TIMEZONE:-America/Sao_Paulo}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
