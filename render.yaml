# Render Blueprint (infra como código) para o backend do FeedLens.
#
# Descreve o serviço web em vez de configurá-lo à mão no painel. Ao aplicar
# este Blueprint (Render > New > Blueprint, apontando para este repo), o Render
# cria/atualiza o serviço com estas opções.
#
# SEGREDOS NUNCA VÃO NESTE ARQUIVO: as variáveis marcadas `sync: false` ficam
# fora do git. O Render pede o valor UMA vez no painel (Environment) e o guarda
# lá; o Blueprint só declara que elas existem. É isso que impede o segredo de
# vazar no histórico do repositório.
#
# A migração do banco roda no ARRANQUE do contêiner (docker/entrypoint.sh,
# `flask db upgrade` antes do gunicorn), porque o free tier do Render NÃO
# suporta pre-deploy command. Assim as tabelas existem antes de servir — sem
# isso, uma rota que lê uma tabela ainda não migrada responde 500.
services:
  - type: web
    name: feedlens
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      # Redundante com o ENV FLASK_APP do Dockerfile; mantido aqui como doc do
      # que o entrypoint (flask db upgrade) usa para achar a app.
      - key: FLASK_APP
        value: wsgi:app

      # --- SEGREDOS: geridos no painel do Render, nunca no git ---
      # Defina o valor de cada um em Environment (uma vez). O boot recusa
      # SECRET_KEY insegura em produção e FEEDLENS_ENCRYPTION_KEY que não seja
      # uma chave Fernet válida (32 bytes em base64 urlsafe).
      - key: SECRET_KEY
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: FEEDLENS_ENCRYPTION_KEY
        sync: false

      # --- Banco: Postgres no Neon (free, sem prazo de expiração) ---
      # Cole aqui a connection string do Neon (Dashboard > Connect), no formato
      # postgresql://USUARIO:SENHA@HOST/BANCO?sslmode=require. É segredo: fica
      # só no painel do Render. Sem ela o app cai no SQLite efêmero do
      # contêiner (os dados somem a cada deploy/hibernação). O Postgres free
      # do próprio Render foi descartado: expira 30 dias após a criação.
      # As tabelas são criadas pelo `flask db upgrade` do entrypoint.
      - key: DATABASE_URL
        sync: false

      # --- Config não-secreta (pode ficar no git) ---
      # Restrinja às origens reais em produção (o padrão do app é '*').
      # - key: CORS_ORIGINS
      #   value: https://SEU-FORM.vercel.app
      # Origem do formulário público para ingestão sem chave (opt-in):
      # - key: INGEST_PUBLIC_ORIGINS
      #   value: https://SEU-FORM.vercel.app
