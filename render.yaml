# Render Blueprint (infra como código) para o backend do FeedLens.
#
# Descreve o serviço web em vez de configurá-lo à mão no painel. Ao aplicar
# este Blueprint (Render > New > Blueprint, apontando para este repo), o Render
# cria/atualiza o serviço com estas opções.
#
# SEGREDOS NUNCA VÃO NESTE ARQUIVO: as variáveis marcadas `sync: false` ficam
# fora do git. O Render pede o valor UMA vez no painel (Environment) e o guarda
# lá; o Blueprint só declara que elas existem. É isso que impede o segredo de
# vazar no histórico do repositório.
#
# A migração do banco roda no ARRANQUE do contêiner (docker/entrypoint.sh,
# `flask db upgrade` antes do gunicorn), porque o free tier do Render NÃO
# suporta pre-deploy command. Assim as tabelas existem antes de servir — sem
# isso, uma rota que lê uma tabela ainda não migrada responde 500.
services:
  - type: web
    name: feedlens
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      # Redundante com o ENV FLASK_APP do Dockerfile; mantido aqui como doc do
      # que o entrypoint (flask db upgrade) usa para achar a app.
      - key: FLASK_APP
        value: wsgi:app

      # --- SEGREDOS: geridos no painel do Render, nunca no git ---
      # Defina o valor de cada um em Environment (uma vez). O boot recusa
      # SECRET_KEY insegura em produção e FEEDLENS_ENCRYPTION_KEY que não seja
      # uma chave Fernet válida (32 bytes em base64 urlsafe).
      - key: SECRET_KEY
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: FEEDLENS_ENCRYPTION_KEY
        sync: false

      # --- Banco: Postgres no Neon (free, sem prazo de expiração) ---
      # Duas strings do Neon (neon env pull, ou Dashboard > Connect), ambas
      # segredo, só no painel do Render:
      #   DATABASE_URL          = a POOLED (host com -pooler): usada pelo app;
      #   DATABASE_URL_UNPOOLED = a DIRETA: usada só pelas migrations do
      #                           entrypoint (DDL não passa pelo PgBouncer).
      # Sem DATABASE_URL o app cai no SQLite efêmero do contêiner (os dados
      # somem a cada deploy/hibernação). O Postgres free do próprio Render foi
      # descartado: expira 30 dias após a criação.
      # As tabelas são criadas pelo `flask db upgrade` do entrypoint.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false

      # --- Chaves de LLM e de ingestão: segredos, só no painel do Render ---
      # OpenRouter e Groq (camada gratuita) alimentam a cadeia LLM_MODELS abaixo.
      # Um provedor listado em LLM_MODELS sem a chave fica fora da cadeia.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Chave de ingestão (X-API-Key) para clientes servidor-a-servidor. O form
      # público entra sem ela pelo INGEST_PUBLIC_ORIGINS abaixo.
      - key: INGEST_API_KEY
        sync: false

      # --- Config não-secreta: valores reais de produção, versionados ---
      # Origem exata do form público (Vercel). A mesma URL nas duas: sem
      # CORS_ORIGINS o navegador bloqueia a resposta; sem INGEST_PUBLIC_ORIGINS
      # o POST sem chave recebe 401 (ingest_key_required). Só origem, sem
      # caminho: uma entrada com caminho é descartada. '*' é recusado no boot.
      - key: CORS_ORIGINS
        value: https://feedlens-tau.vercel.app
      - key: INGEST_PUBLIC_ORIGINS
        value: https://feedlens-tau.vercel.app
      # Teto diário de envios públicos, alinhado às 50 chamadas/dia dos modelos
      # :free do OpenRouter em contas sem créditos (com 10+ créditos são 1000).
      - key: INGEST_PUBLIC_DAILY_CAP
        value: "50"
      # Cadeia de LLM, principal primeiro: gemma (grátis) -> Groq (grátis e
      # rápido, cobre o 429 do gemma) -> roteador de modelos grátis (lento,
      # última reserva). Numa linha só: uma quebra derruba o boot.
      - key: LLM_MODELS
        value: openrouter/google/gemma-4-31b-it:free,groq/openai/gpt-oss-20b,openrouter/openrouter/free
